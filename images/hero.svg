<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16294a"/><stop offset="1" stop-color="#2a1f5c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c9cff"/><stop offset="1" stop-color="#a98bff"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="220" fill="#55d6e8" opacity=".10"/>
  <circle cx="150" cy="620" r="260" fill="#a98bff" opacity=".12"/>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 140H1200M0 280H1200M0 420H1200M0 560H1200M200 0V700M400 0V700M600 0V700M800 0V700M1000 0V700"/>
  </g>
  <!-- code window -->
  <g transform="translate(330 40)">
    <rect width="640" height="400" rx="22" fill="#0b1220" stroke="#4a6ba3" stroke-opacity=".6"/>
    <rect width="640" height="52" rx="22" fill="#14213a"/>
    <rect y="30" width="640" height="22" fill="#14213a"/>
    <circle cx="30" cy="26" r="7" fill="#ff7185"/><circle cx="54" cy="26" r="7" fill="#ffb86b"/><circle cx="78" cy="26" r="7" fill="#55d6a0"/>
    <g font-family="monospace" font-size="22">
      <text x="36" y="108" fill="#a98bff">const</text><text x="108" y="108" fill="#edf3ff">nest</text><text x="170" y="108" fill="#91a0b8">=</text><text x="200" y="108" fill="#55d6a0">"CodeNest"</text>
      <text x="36" y="154" fill="#a98bff">function</text><text x="150" y="154" fill="#6c9cff">calculate</text><text x="268" y="154" fill="#edf3ff">(n) {</text>
      <text x="70" y="200" fill="#a98bff">while</text><text x="140" y="200" fill="#edf3ff">(i &lt;= n)</text><text x="260" y="200" fill="#edf3ff">{</text>
      <text x="104" y="246" fill="#55d6e8">total</text><text x="170" y="246" fill="#91a0b8">*=</text><text x="205" y="246" fill="#ffb86b">i++</text>
      <text x="70" y="292" fill="#edf3ff">}</text>
      <text x="70" y="338" fill="#a98bff">return</text><text x="150" y="338" fill="#edf3ff">total</text>
      <text x="36" y="372" fill="#edf3ff">}</text>
    </g>
  </g>
  <!-- floating chips -->
  <g font-family="monospace" font-weight="700" text-anchor="middle">
    <g transform="translate(180 190)"><rect x="-60" y="-34" width="120" height="68" rx="16" fill="#0b1220" stroke="#6c9cff" stroke-opacity=".7"/><text y="10" font-size="30" fill="#a98bff">⇄</text></g>
    <g transform="translate(1030 260)"><rect x="-60" y="-34" width="120" height="68" rx="16" fill="#0b1220" stroke="#55d6a0" stroke-opacity=".7"/><text y="10" font-size="30" fill="#55d6a0">₱</text></g>
    <g transform="translate(1010 430)"><rect x="-60" y="-34" width="120" height="68" rx="16" fill="#0b1220" stroke="#ffb86b" stroke-opacity=".7"/><text y="10" font-size="30" fill="#ffb86b">⟳</text></g>
    <g transform="translate(190 400)"><rect x="-60" y="-34" width="120" height="68" rx="16" fill="#0b1220" stroke="#78b2ff" stroke-opacity=".7"/><text y="10" font-size="30" fill="#78b2ff">▤</text></g>
  </g>
</svg>
